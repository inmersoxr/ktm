name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ktm-vite-verified
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live viewer and AR diagnostics
        run: node scripts/smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: smoke-results/
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # This repository is also configured for GitHub's legacy branch/Jekyll
      # deployment. It publishes uncompiled .ts sources and can overwrite the
      # functional Vite build if it completes after our custom workflow.
      # Until Pages Settings is switched to GitHub Actions, publish LAST.
      - name: Wait for concurrent branch-based Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for attempt in $(seq 1 60); do
            statuses=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" --jq '.workflow_runs[] | select(.name == "pages build and deployment") | .status')
            if [ -z "$statuses" ]; then
              echo "No legacy Pages deployment detected."
              break
            fi
            unfinished=$(printf '%s\n' "$statuses" | grep -v '^completed || true)
            if [ -z "$unfinished" ]; then
              echo "Legacy Pages publication finished. Publishing validated Vite artifact last."
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo "Legacy Pages deployment is still active; refusing a competing publish."
              exit 1
            fi
            sleep 5
          done
      - name: Deploy validated Vite site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify LIVE built pages and splat assets (not raw TypeScript)
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          ok=0
          for attempt in $(seq 1 24); do
            viewer=$(curl -fsSL --max-time 20 "${SITE_URL}?v=${GITHUB_SHA}" || true)
            ar=$(curl -fsSL --max-time 20 "${SITE_URL}ar.html?v=${GITHUB_SHA}" || true)
            if printf '%s' "$viewer" | grep -Eq 'assets/[A-Za-z0-9_-]+\.js' &&
               printf '%s' "$ar" | grep -Eq 'assets/[A-Za-z0-9_-]+\.js' &&
               ! printf '%s' "$viewer" | grep -q '/src/main.ts' &&
               ! printf '%s' "$ar" | grep -q '/src/ar.ts'; then
              echo "Compiled viewer and AR entrypoints are now live."
              ok=1
              break
            fi
            echo "Still seeing stale or raw branch output; waiting for compiled Vite pages..."
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "ERROR: live GitHub Pages still serves source files instead of compiled JavaScript."; exit 1; fi
          for path in "splat/meta.json" "splat/means_l.webp"; do
            curl -fsSL --max-time 20 -o /dev/null "${SITE_URL}${path}" || exit 1
            echo "Asset available: ${SITE_URL}${path}"
          done
