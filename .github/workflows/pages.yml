name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live viewer and AR diagnostics
        run: node scripts/smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: smoke-results/
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site, AR page and model assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          for path in "" "ar.html" "splat/meta.json" "splat/means_l.webp"; do
            ok=0
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 20 -o /dev/null "${SITE_URL}${path}"; then
                echo "OK ${SITE_URL}${path}"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then echo "FAILED ${SITE_URL}${path}"; exit 1; fi
          done
