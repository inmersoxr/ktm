name: Validate AR Dissolve Startup Fix

on:
  push:
    branches: [fix/ar-dissolve-start-visible]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Geometry tests
        run: node scripts/test-geometry.mjs
      - name: Install browser tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop, AR warmup, and replay
        run: node scripts/smoke.mjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktm-ar-startup-fix
          path: smoke-results/
          if-no-files-found: ignore
