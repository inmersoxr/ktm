name: KTM Vertical Dissolve Validation

on:
  push:
    branches:
      - feature/ktm-vertical-dissolve

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Geometry regression
        run: node scripts/test-geometry.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser tests with dissolve verification
        run: node scripts/smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktm-dissolve-screenshots
          path: smoke-results/
          if-no-files-found: ignore
